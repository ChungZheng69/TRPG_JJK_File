openapi: 3.1.0
info:
  title: JJK TRPG Narrative Engine API
  version: 3.0.0
  description: Persistent JJK TRPG backend. V3 uses AI-led narrative combat, authoritative
    dice and saved HP/CE, plus milestone growth.
servers:
- url: https://trpg-jjk-file.onrender.com
security:
- bearerAuth: []
paths:
  /campaigns/{campaignId}:
    get:
      operationId: loadCampaignContext
      summary: Load the authoritative campaign state
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: Campaign loaded
        '404':
          description: Campaign does not exist
  /campaigns/{campaignId}/character/create:
    post:
      operationId: createCharacterCampaign
      summary: Create a campaign and authoritative player character
      description: Use for a brand-new campaign. Character fields are flat for reliable
        Custom GPT Action calls. Reload after creation to verify the save.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &id001
              - name
              - physical
              - technique
              - mind
              - hp_max
              - ce_max
              properties:
                overwrite:
                  type: boolean
                  default: false
                player_id: &id002
                  type: string
                  default: player_001
                name: &id003
                  type: string
                age: &id004
                  type: integer
                  minimum: 0
                  maximum: 999
                gender: &id005
                  type: string
                affiliation: &id006
                  type: string
                grade: &id007
                  type: string
                era: &id008
                  type: string
                appearance: &id009
                  type: string
                personality: &id010
                  type: string
                goal: &id011
                  type: string
                level: &id012
                  type: integer
                  minimum: 1
                  default: 1
                physical: &id013
                  type: integer
                  minimum: 0
                  maximum: 100
                technique: &id014
                  type: integer
                  minimum: 0
                  maximum: 100
                mind: &id015
                  type: integer
                  minimum: 0
                  maximum: 100
                hp_max: &id016
                  type: integer
                  minimum: 1
                hp_current: &id017
                  type: integer
                  minimum: 0
                ce_max: &id018
                  type: integer
                  minimum: 1
                ce_current: &id019
                  type: integer
                  minimum: 0
                defense_dc: &id020
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 10
                speed: &id021
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 50
                innate_technique_name: &id022
                  type: string
                innate_technique_description: &id023
                  type: string
                start_date_time: &id024
                  type: string
                start_location: &id025
                  type: string
                start_situation: &id026
                  type: string
              additionalProperties: false
      responses:
        '201':
          description: Character campaign created
        '400':
          description: Invalid character data
        '409':
          description: Campaign already exists
  /campaigns/{campaignId}/character:
    patch:
      operationId: updatePlayerCharacter
      summary: Repair or explicitly respec the player character
      description: Use for setup correction or explicit respec, not ordinary growth.
        Character growth must use applyCharacterGrowth.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: *id001
              properties:
                player_id: *id002
                name: *id003
                age: *id004
                gender: *id005
                affiliation: *id006
                grade: *id007
                era: *id008
                appearance: *id009
                personality: *id010
                goal: *id011
                level: *id012
                physical: *id013
                technique: *id014
                mind: *id015
                hp_max: *id016
                hp_current: *id017
                ce_max: *id018
                ce_current: *id019
                defense_dc: *id020
                speed: *id021
                innate_technique_name: *id022
                innate_technique_description: *id023
                start_date_time: *id024
                start_location: *id025
                start_situation: *id026
                reset_abilities:
                  type: boolean
                  default: false
              additionalProperties: false
      responses:
        '200':
          description: Player updated
  /campaigns/{campaignId}/narrative:
    patch:
      operationId: updateCampaignNarrative
      summary: Update narrative-only campaign memory
      description: Save scene, quests, relationships, flags, facts, recent events,
        canon changes or rolling summary. Do not use for mechanical stats.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scene:
                  type: object
                  properties:
                    date_time:
                      type: string
                    location:
                      type: string
                    situation:
                      type: string
                    present_npcs:
                      type: array
                      items:
                        type: string
                  additionalProperties: true
                quests:
                  type: array
                  items:
                    type: string
                relationships:
                  type: object
                  properties:
                    summary:
                      type: string
                  additionalProperties: true
                campaign_flags:
                  type: object
                  properties:
                    summary:
                      type: string
                  additionalProperties: true
                canon_changes:
                  type: array
                  items:
                    type: string
                important_facts:
                  type: array
                  items:
                    type: string
                recent_events:
                  type: array
                  items:
                    type: string
                rolling_summary:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Narrative memory updated
  /campaigns/{campaignId}/check:
    post:
      operationId: runAttributeCheck
      summary: Roll an authoritative narrative attribute check
      description: Roll dice for an uncertain action. Returns success margin and degree
        for AI narration. It does not apply damage or advance turns.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - actor_id
              - attribute
              - difficulty
              properties:
                actor_id:
                  type: string
                attribute:
                  type: string
                  enum:
                  - physical
                  - technique
                  - mind
                difficulty:
                  type: integer
                  minimum: 1
                  maximum: 30
                bonus_dice:
                  type: integer
                  minimum: 0
                  maximum: 5
                  default: 0
                penalty_dice:
                  type: integer
                  minimum: 0
                  maximum: 5
                  default: 0
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Check resolved
  /campaigns/{campaignId}/check/reroll:
    post:
      operationId: rerollLastCheck
      summary: Reroll the latest standalone check
      description: Use only when the player explicitly requests a reroll. Reuses the
        saved actor, attribute, DC and modifiers.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_check_id:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Latest check rerolled
  /campaigns/{campaignId}/resources/change:
    post:
      operationId: applyResourceChange
      summary: Apply an authoritative HP or CE change
      description: After AI interprets a dice result, use this to commit damage, healing,
        CE spend or CE recovery to the persistent save.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_id
              - operation
              - amount
              properties:
                target_id:
                  type: string
                operation:
                  type: string
                  enum:
                  - damage
                  - heal
                  - spend_ce
                  - restore_ce
                amount:
                  type: number
                  exclusiveMinimum: 0
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource changed
  /campaigns/{campaignId}/enemies:
    post:
      operationId: createDynamicEnemy
      summary: Create a mechanically relevant enemy
      description: GPT supplies concept and grade. Engine generates stable reference
        stats and HP/CE. No initiative or turn order is created.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - grade
              properties:
                name:
                  type: string
                grade:
                  type: string
                  enum:
                  - Grade 4
                  - Grade 3
                  - Grade 2
                  - Grade 1
                  - Special Grade
                role:
                  type: string
                theme:
                  type: string
                persistence:
                  type: string
                  enum:
                  - scene
                  - campaign
                  default: scene
                notes:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Enemy created
  /campaigns/{campaignId}/abilities:
    post:
      operationId: createDynamicAbility
      summary: Create and attach a reusable ability
      description: GPT chooses the ability concept, reference damage range and CE
        cost. These guide narrative resolution; Engine does not auto-roll damage.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - owner_id
              - name
              - type
              - attribute
              - power
              - cost
              properties:
                owner_id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - attack
                  - heal
                  - utility
                attribute:
                  type: string
                  enum:
                  - physical
                  - technique
                  - mind
                power:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - extreme
                cost:
                  type: string
                  enum:
                  - none
                  - low
                  - medium
                  - high
                  - extreme
                damage_min:
                  type: integer
                  minimum: 1
                  maximum: 120
                damage_max:
                  type: integer
                  minimum: 1
                  maximum: 120
                ce_cost:
                  type: integer
                  minimum: 0
                  maximum: 100
                effect_kind:
                  type: string
                description:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Ability created
  /campaigns/{campaignId}/entities/state:
    patch:
      operationId: updateEntityState
      summary: Persist a narrative combat status or position
      description: Use for consequences such as injured leg, stunned, restrained,
        displaced, behind cover or other persistent scene state.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_id
              properties:
                target_id:
                  type: string
                add_status:
                  type: string
                remove_status:
                  type: string
                position:
                  type: string
                note:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Entity state updated
  /campaigns/{campaignId}/growth/evidence:
    post:
      operationId: recordGrowthEvidence
      summary: Record meaningful evidence of character growth
      description: Record training, mastery, hardship or insight that may justify
        later growth. Routine attacks should not create growth evidence.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - category
              - significance
              - note
              properties:
                category:
                  type: string
                  enum:
                  - physical
                  - technique
                  - mind
                  - hp
                  - ce
                  - ability
                  - grade
                  - general
                significance:
                  type: string
                  enum:
                  - minor
                  - meaningful
                  - major
                note:
                  type: string
                related_ability_id:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Growth evidence recorded
  /campaigns/{campaignId}/growth/apply:
    post:
      operationId: applyCharacterGrowth
      summary: Apply milestone-based character growth
      description: AI decides justified growth from recorded evidence. Engine validates
        caps, applies stats or max resources, and permanently logs the change.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - evidence_ids
              - growth_scale
              properties:
                reason:
                  type: string
                evidence_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                growth_scale:
                  type: string
                  enum:
                  - minor
                  - significant
                  - breakthrough
                physical_delta:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                technique_delta:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                mind_delta:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                hp_max_delta:
                  type: integer
                  minimum: 0
                  maximum: 25
                  default: 0
                ce_max_delta:
                  type: integer
                  minimum: 0
                  maximum: 30
                  default: 0
                new_grade:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Character growth applied
  /campaigns/{campaignId}/abilities/evolve:
    patch:
      operationId: evolveAbility
      summary: Evolve an existing ability after justified growth
      description: Use recorded growth evidence to change an ability reference range,
        CE cost, description, effect or mastery note. Built-in attacks cannot evolve.
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ability_id
              - reason
              - evidence_ids
              properties:
                ability_id:
                  type: string
                reason:
                  type: string
                evidence_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                new_name:
                  type: string
                damage_min:
                  type: integer
                  minimum: 1
                  maximum: 120
                damage_max:
                  type: integer
                  minimum: 1
                  maximum: 120
                ce_cost:
                  type: integer
                  minimum: 0
                  maximum: 100
                new_effect_kind:
                  type: string
                new_description:
                  type: string
                mastery_note:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Ability evolved
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
