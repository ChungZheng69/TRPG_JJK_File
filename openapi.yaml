openapi: 3.1.0
info:
  title: JJK TRPG Engine API
  version: 2.2.0
  description: >-
    Stateful JJK TRPG engine for Custom GPT. Character creation uses flat
    request fields so Custom GPT Actions can reliably see and submit every
    player value. The engine is authoritative for stats, dice, HP/CE,
    ability values, enemy values, and combat.

servers:
  - url: https://trpg-jjk-file.onrender.com
  
security:
  - bearerAuth: []

paths:
  /campaigns/{campaignId}:
    get:
      operationId: loadCampaignContext
      summary: Load the authoritative campaign state
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      responses:
        '200':
          description: Campaign loaded
        '404':
          description: Campaign does not exist

  /campaigns/{campaignId}/character/create:
    post:
      operationId: createCharacterCampaign
      summary: Create a new campaign and its authoritative player character
      description: >-
        ALWAYS use this action for a brand-new character/campaign.
        All player fields are explicit top-level request fields.
        After success, call loadCampaignContext to verify the saved state.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: New campaign ID.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - physical
                - technique
                - mind
                - hp_max
                - ce_max
              properties:
                overwrite:
                  type: boolean
                  default: false
                  description: Use true only when the user explicitly requests a full reset.
                player_id:
                  type: string
                  default: player_001
                name:
                  type: string
                age:
                  type: integer
                  minimum: 0
                  maximum: 999
                gender:
                  type: string
                affiliation:
                  type: string
                grade:
                  type: string
                era:
                  type: string
                appearance:
                  type: string
                personality:
                  type: string
                goal:
                  type: string
                level:
                  type: integer
                  minimum: 1
                  default: 1
                physical:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Physical attribute.
                technique:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Technique attribute.
                mind:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Mind attribute.
                hp_max:
                  type: integer
                  minimum: 1
                hp_current:
                  type: integer
                  minimum: 0
                  description: Omit to start at hp_max.
                ce_max:
                  type: integer
                  minimum: 1
                ce_current:
                  type: integer
                  minimum: 0
                  description: Omit to start at ce_max.
                defense_dc:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 10
                speed:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 50
                innate_technique_name:
                  type: string
                innate_technique_description:
                  type: string
                start_date_time:
                  type: string
                start_location:
                  type: string
                start_situation:
                  type: string
              additionalProperties: false
      responses:
        '201':
          description: Character campaign created
        '400':
          description: Invalid or incomplete character data
        '409':
          description: Campaign already exists

  /campaigns/{campaignId}/character:
    patch:
      operationId: updatePlayerCharacter
      summary: Replace or repair the authoritative player data in an existing campaign
      description: >-
        Use only for character setup correction, migration, or an explicit user-approved
        respec outside combat. This changes real engine state.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - physical
                - technique
                - mind
                - hp_max
                - ce_max
              properties:
                reset_abilities:
                  type: boolean
                  default: false
                player_id:
                  type: string
                  default: player_001
                name:
                  type: string
                age:
                  type: integer
                  minimum: 0
                  maximum: 999
                gender:
                  type: string
                affiliation:
                  type: string
                grade:
                  type: string
                era:
                  type: string
                appearance:
                  type: string
                personality:
                  type: string
                goal:
                  type: string
                level:
                  type: integer
                  minimum: 1
                  default: 1
                physical:
                  type: integer
                  minimum: 0
                  maximum: 100
                technique:
                  type: integer
                  minimum: 0
                  maximum: 100
                mind:
                  type: integer
                  minimum: 0
                  maximum: 100
                hp_max:
                  type: integer
                  minimum: 1
                hp_current:
                  type: integer
                  minimum: 0
                ce_max:
                  type: integer
                  minimum: 1
                ce_current:
                  type: integer
                  minimum: 0
                defense_dc:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 10
                speed:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 50
                innate_technique_name:
                  type: string
                innate_technique_description:
                  type: string
                start_date_time:
                  type: string
                start_location:
                  type: string
                start_situation:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Player updated and saved
        '400':
          description: Invalid data or active combat
        '404':
          description: Campaign does not exist

  /campaigns/{campaignId}/narrative:
    patch:
      operationId: updateCampaignNarrative
      summary: Update narrative-only campaign fields
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scene:
                  type: object
                  properties:
                    date_time:
                      type: string
                    location:
                      type: string
                    situation:
                      type: string
                  additionalProperties: true
                quests:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      status:
                        type: string
                    additionalProperties: true
                relationships:
                  type: object
                  additionalProperties: true
                campaign_flags:
                  type: object
                  additionalProperties: true
                canon_changes:
                  type: array
                  items:
                    type: object
                    properties:
                      event_id:
                        type: string
                      campaign_result:
                        type: string
                    additionalProperties: true
                important_facts:
                  type: array
                  items:
                    type: string
                recent_events:
                  type: array
                  items:
                    type: string
                rolling_summary:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Narrative updated

  /campaigns/{campaignId}/check:
    post:
      operationId: runAttributeCheck
      summary: Roll an authoritative attribute check
      description: Every complete 20 stat gives 1 positive d20, maximum 5, keep highest.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actor_id
                - attribute
                - difficulty
              properties:
                actor_id:
                  type: string
                attribute:
                  type: string
                  enum: [physical, technique, mind]
                difficulty:
                  type: integer
                  minimum: 1
                  maximum: 30
                bonus_dice:
                  type: integer
                  minimum: 0
                  maximum: 5
                  default: 0
                penalty_dice:
                  type: integer
                  minimum: 0
                  maximum: 5
                  default: 0
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Check resolved

  /campaigns/{campaignId}/resources/change:
    post:
      operationId: applyResourceChange
      summary: Apply an authoritative HP or CE change outside normal combat
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, operation, amount]
              properties:
                target_id:
                  type: string
                operation:
                  type: string
                  enum: [damage, heal, spend_ce, restore_ce]
                amount:
                  type: number
                  exclusiveMinimum: 0
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource changed

  /campaigns/{campaignId}/enemies:
    post:
      operationId: createDynamicEnemy
      summary: Create a dynamic enemy; the engine generates numeric stats
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, grade]
              properties:
                name:
                  type: string
                grade:
                  type: string
                  enum: [Grade 4, Grade 3, Grade 2, Grade 1, Special Grade]
                role:
                  type: string
                theme:
                  type: string
                persistence:
                  type: string
                  enum: [scene, campaign]
                  default: scene
                notes:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Enemy created

  /campaigns/{campaignId}/abilities:
    post:
      operationId: createDynamicAbility
      summary: Create and attach a dynamic ability using engine balance tiers
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_id, name, type, attribute, power, cost]
              properties:
                owner_id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum: [attack, heal, utility]
                attribute:
                  type: string
                  enum: [physical, technique, mind]
                power:
                  type: string
                  enum: [low, medium, high, extreme]
                cost:
                  type: string
                  enum: [none, low, medium, high, extreme]
                effect_kind:
                  type: string
                description:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Ability created

  /campaigns/{campaignId}/combat/start:
    post:
      operationId: startCombat
      summary: Start combat and calculate turn order
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enemy_ids]
              properties:
                enemy_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                ally_ids:
                  type: array
                  items:
                    type: string
              additionalProperties: false
      responses:
        '200':
          description: Combat started

  /campaigns/{campaignId}/combat/action:
    post:
      operationId: resolveCombatAction
      summary: Resolve one combat turn
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id, target_id]
              properties:
                actor_id:
                  type: string
                target_id:
                  type: string
                ability_id:
                  type: string
                  default: basic_attack
              additionalProperties: false
      responses:
        '200':
          description: Combat action resolved

components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
